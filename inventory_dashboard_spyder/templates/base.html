<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        IMS
        {% endblock %}
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f4f5f7;

            color: #222;
        }


        /* ================================
           TOP NAVIGATION
        ================================= */

        .top-nav {

            width: 100%;

            height: 64px;

            background: white;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 30px;

            border-bottom: 1px solid #e5e5e5;

            position: sticky;

            top: 0;

            z-index: 1000;
        }


        .nav-brand {

            text-decoration: none;

            color: #222;

            font-size: 24px;

            font-weight: 800;

            letter-spacing: 1px;
        }


        .nav-menu {

            position: relative;
        }


        .nav-menu summary {

            list-style: none;

            cursor: pointer;

            padding: 10px 14px;

            border-radius: 8px;

            font-weight: 600;

            user-select: none;
        }


        .nav-menu summary::-webkit-details-marker {
            display: none;
        }


        .nav-menu summary:hover {

            background: #f2f2f2;
        }


        .nav-dropdown {

            position: absolute;

            right: 0;

            top: calc(100% + 8px);

            width: 190px;

            background: white;

            border: 1px solid #ddd;

            border-radius: 10px;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,0.12);

            overflow: hidden;
        }


        .nav-dropdown a {

            display: block;

            padding: 13px 16px;

            text-decoration: none;

            color: #222;

            font-weight: 500;
        }


        .nav-dropdown a:hover {

            background: #f5f5f5;
        }


        /* ================================
           MAIN CONTAINER
        ================================= */

        .container {

            max-width: 1400px;

            margin: 0 auto;

            padding: 30px;
        }


        /* ================================
           FLASH MESSAGES
        ================================= */

        .flash {

            padding: 12px 16px;

            margin-bottom: 15px;

            border-radius: 8px;

            background: #eeeeee;

            border: 1px solid #ddd;
        }


        @media (max-width: 600px) {

            .top-nav {

                padding: 0 15px;
            }


            .container {

                padding: 20px 15px;
            }

        }

    </style>

</head>


<body>


    <!-- NAVIGATION -->

    <nav class="top-nav">

        <a
            class="nav-brand"
            href="{{ url_for('dashboard') }}"
        >
            IMS
        </a>


        <details class="nav-menu">

            <summary>
                ☰ Menu
            </summary>


            <div class="nav-dropdown">

                <a
                    href="{{ url_for('dashboard') }}"
                >
                    📦 Inventory
                </a>


                <a
                    href="{{ url_for('manage_data') }}"
                >
                    🗄️ Manage Data
                </a>

            </div>

        </details>

    </nav>


    <!-- MAIN CONTENT -->

    <main class="container">


        <!-- FLASH MESSAGES -->

        {% with messages = get_flashed_messages() %}

            {% if messages %}

                {% for message in messages %}

                    <div class="flash">

                        {{ message }}

                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        {% block content %}

        {% endblock %}


    </main>


</body>

</html>
